# PRAXIS - configuracion base

quarkus.application.name=praxis

# HTTP y Quarkus REST. Las rutas REST quedan en la raiz (CR-1).
quarkus.http.port=8080
quarkus.http.root-path=/

# Base de datos PostgreSQL existente (Supabase). Sin credenciales en el repositorio.
# config/local.properties define quarkus.datasource.jdbc.url, quarkus.datasource.username
# y quarkus.datasource.password; se carga con -Dquarkus.config.locations.
quarkus.datasource.db-kind=postgresql

# Hibernate solo se adapta al esquema existente; nunca lo genera ni lo modifica.
quarkus.hibernate-orm.schema-management.strategy=none

# Qute: soporte de plantillas preparado; aun no hay plantillas ni vistas implementadas.
quarkus.qute.strict-rendering=true

# La zona de negocio es America/Guayaquil; la conversion se aplicara en el codigo
# cuando se implementen las entidades y las vistas (ARQUITECTURA.md Â§12.5).

# Seguridad del Incremento 2 (SEGURIDAD.md Â§2.8). Valores aprobados.
# La cookie y la sesion duran lo mismo: 30 minutos (1800 segundos).
praxis.seguridad.sesion.duracion=PT30M
praxis.seguridad.intentos.maximo=5
praxis.seguridad.bloqueo.duracion=PT15M
praxis.seguridad.cookie.nombre=PRAXIS_SESSION
praxis.seguridad.cookie.max-age=PT30M
praxis.seguridad.cookie.same-site=Lax

# Inicializacion del primer administrador: deshabilitada por defecto (fail-closed).
praxis.seguridad.admin-inicial.enabled=false
