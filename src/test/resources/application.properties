# Configuracion exclusiva de pruebas del Incremento 2.
# La contrasena se lee de config/test-local.properties (no versionado) mediante
# -Dquarkus.config.locations. Nunca se usa la conexion de Supabase.
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:55432/praxis_test
%test.quarkus.datasource.username=praxis_test
%test.quarkus.datasource.password=${praxis.test.datasource.password}
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.hibernate-orm.jdbc.timezone=America/Guayaquil
%test.quarkus.http.test-port=8081
